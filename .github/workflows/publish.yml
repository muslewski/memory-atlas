name: Publish to npm

# NPM_TOKEN is set on every fleet repo (see agentic-sage propagate workflow).
# Alternatives: ship-npm (local) · Fleet npm publish on muslewski/agentic-sage.
on:
  push:
    tags:
      - 'v*'
      - 'memory-atlas-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish memory-atlas with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Optional presentation companion (skip if version already on registry)
      - name: Publish memory-atlas-visuals with provenance
        working-directory: packages/memory-atlas-visuals
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "already on registry: $name@$ver"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
